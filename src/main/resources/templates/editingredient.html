<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Ingredient</title>
</head>

<body>
    <h1>Edit ingredient</h1>
    <form th:action="@{/save}" th:object="${ingredient}" method="post">
        <input type="hidden" th:field="*{id}" />
        Name: <input type="text" th:field="*{name}" /><br>
        Quantity: <input type="number" step="0.01" th:field="*{quantity}" /><br>
        Unit: <input type="text" th:field="*{unit}" /><br>
        Price (€): <input type="number" step="0.01" th:field="*{price}" /><br>
        Low stock threshold: <input type="number" step="0.01" th:field="*{lowStockThreshold}" /><br>
        Category:
        <select th:field="*{category}">
            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
        </select><br>
        <button type="submit">Save</button>
        Supplier:
        <select th:field="*{supplier}">
            <option th:each="supplier : ${suppliers}" th:value="${supplier.id}" th:text="${supplier.name}"></option>
        </select><br>
    </form>
</body>

</html>
