<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <meta charset="UTF-8">
    <title>MJtea — Inventory</title>
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
    <div class="container mt-4">
        <h1>MJtea - Inventory</h1>

        <!-- Ô tìm kiếm theo tên -->
        <form th:action="@{/ingredientlist}" method="get" class="mb-3">
            <input type="text" name="search" placeholder="Search by name..." class="form-control d-inline-block"
                style="width:250px" />
            <button type="submit" class="btn btn-primary btn-sm">Search</button>
            <a th:href="@{/ingredientlist}" class="btn btn-secondary btn-sm">Show all</a>
            <a th:href="@{/ingredientlist(filter='lowstock')}" class="btn btn-warning btn-sm">Low stock only</a>
        </form>

        <!-- Hiện tên người đang đăng nhập -->
        <p>Welcome <span sec:authentication="name">Name</span></p>

        <!-- Nút đăng xuất -->
        <form th:action="@{/logout}" method="post">
            <input type="submit" value="Sign Out" class="btn btn-sm btn-secondary" />
        </form>

        <table class="table table-striped mt-3">
            <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Supplier</th>
                <th>Quantity</th>
                <th>Unit</th>
                <th>Price (€)</th>
                <th></th>
                <!-- Cột Delete chỉ MANAGER thấy -->
                <th sec:authorize="hasRole('MANAGER')"></th>
            </tr>
            <tr th:each="ingredient : ${ingredients}" th:classappend="${ingredient.lowStock} ? 'table-danger' : ''">
                <td th:text="${ingredient.name}"></td>
                <td th:text="${ingredient.category != null ? ingredient.category.name : ''}"></td>
                <td th:text="${ingredient.supplier != null ? ingredient.supplier.name : ''}"></td>
                <td th:text="${ingredient.quantity}"></td>
                <td th:text="${ingredient.unit}"></td>
                <td th:text="${ingredient.price}"></td>
                <td><a class="btn btn-primary btn-sm" th:href="@{/edit/{id}(id=${ingredient.id})}">Edit</a></td>
                <!-- Nút Delete chỉ ADMIN thấy -->
                <!-- Nút Delete chỉ MANAGER thấy -->
                <td sec:authorize="hasRole('MANAGER')">
                    <a class="btn btn-danger btn-sm" th:href="@{/delete/{id}(id=${ingredient.id})}">Delete</a>
                </td>
            </tr>
        </table>

        <a class="btn btn-success" th:href="@{/add}">Add Ingredient</a>
    </div>
</body>

</html>
