<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Ingredient</title>
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    <link type="text/css" rel="stylesheet" href="/css/mjtea.css" th:href="@{/css/mjtea.css}" />
</head>

<body>
    <div class="container mt-4">
        <div class="card-box">
            <h1>Add new ingredient</h1>
            <form th:action="@{/save}" th:object="${ingredient}" method="post">
                <input type="hidden" th:field="*{id}" />

                <label>Name</label>
                <input type="text" th:field="*{name}" class="form-control mb-2" />

                <label>Quantity</label>
                <input type="number" step="0.01" th:field="*{quantity}" class="form-control mb-2" />

                <label>Unit</label>
                <input type="text" th:field="*{unit}" class="form-control mb-2" />

                <label>Price (€)</label>
                <input type="number" step="0.01" th:field="*{price}" class="form-control mb-2" />

                <label>Low stock threshold</label>
                <input type="number" step="0.01" th:field="*{lowStockThreshold}" class="form-control mb-2" />

                <label>Expiry date</label>
                <input type="date" th:field="*{expiryDate}" class="form-control mb-2" />

                <label>Category</label>
                <select th:field="*{category}" class="form-control mb-2">
                    <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">
                    </option>
                </select>

                <label>Supplier</label>
                <select th:field="*{supplier}" class="form-control mb-3">
                    <option th:each="supplier : ${suppliers}" th:value="${supplier.id}" th:text="${supplier.name}">
                    </option>
                </select>

                <button type="submit" class="btn btn-success">Save</button>
                <a th:href="@{/ingredientlist}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</body>

</html>
